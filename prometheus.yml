global:
  # Define o intervalo padrão para raspar as métricas de todos os 'jobs'
  scrape_interval: 15s

# Lista de destinos que o Prometheus deve monitorar
scrape_configs:
  
  # Job 1: Monitoramento do Próprio Prometheus (Default)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Job 2: Serviço A (Produtos - Python gRPC)
  - job_name: 'service_a'
    metrics_path: /metrics
    static_configs:
      - targets: ['service_a:8000'] 

  # Job 3: Serviço B (Estoque/Frete - Python gRPC)
  - job_name: 'service_b'
    metrics_path: /metrics
    static_configs:
      - targets: ['service_b:8000']

  # Job 4: Serviço P (API Gateway - Node.js/Express)
  - job_name: 'service_p_gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:4000']